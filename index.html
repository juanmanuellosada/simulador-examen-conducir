<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Simulador de examen teórico de conducir</title>
  <meta name="description" content="Simulador del examen teórico de conducir clase B (Provincia de Buenos Aires): examen real cronometrado, estudio por tema, repaso de errores y estadísticas." />
  <meta name="theme-color" content="#0F172A" />
  <script>
    // Anti-FOUC: aplica el tema guardado antes del primer paint. Duplica el
    // mínimo de lectura de storage.js (que es un módulo ES y no llega a
    // tiempo); la escritura y validación completa viven en storage.js.
    (function () {
      try {
        var t = localStorage.getItem('sim_examen_tema_v1');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>

  <header class="app-header">
    <h1>Simulador Examen Teórico</h1>
    <p class="app-header-sub">Clase B — Provincia de Buenos Aires</p>
    <div id="theme-switcher-slot" class="theme-switcher-slot"></div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <p>Cargando…</p>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button type="button" data-route="inicio" aria-current="page">
      <span>Inicio</span>
    </button>
    <button type="button" data-route="examen">
      <span>Examen</span>
    </button>
    <button type="button" data-route="estudio">
      <span>Estudio</span>
    </button>
    <button type="button" data-route="errores">
      <span>Errores</span>
    </button>
    <button type="button" data-route="senales">
      <span>Señales</span>
    </button>
    <button type="button" data-route="estadisticas">
      <span>Stats</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
